name: AI security validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Test guardrails and adversarial cases
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install --disable-pip-version-check --no-input -e .

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Run unit and API tests
        run: python -m unittest discover -s tests -v

      - name: Run adversarial evaluation
        run: |
          python -m ai_security_guardrails evaluate \
            --dataset evals/adversarial-cases.jsonl \
            --report /tmp/evaluation-report.md \
            --fail-on-mismatch
          diff -u reports/evaluation-report.md /tmp/evaluation-report.md
