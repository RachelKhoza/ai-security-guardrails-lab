[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-security-guardrails-lab"
version = "0.1.0"
description = "Deterministic security guardrails and evaluation tooling for LLM-backed services."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rachel Khoza" }]
dependencies = []

[project.scripts]
ai-guardrails = "ai_security_guardrails.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
